{% extends "base.html" %}{% block content %}
<h1>📧 Email Settings</h1>
<div class="form">
<h2>Automatic School Login Email</h2>
<p>License तयार झाल्यावर School/College च्या Email वर User ID आणि Password पाठवण्यासाठी खालील SMTP details भरा.</p>
<form method="post">
<label>SMTP Host</label>
<input name="smtp_host" value="{{cfg.get('smtp_host','smtp.gmail.com')}}" required>
<label>SMTP Port</label>
<input name="smtp_port" value="{{cfg.get('smtp_port','587')}}" required>
<label>Sender Email</label>
<input type="email" name="smtp_email" value="{{cfg.get('smtp_email','')}}" required>
<label>Email App Password / SMTP Password</label>
<input type="password" name="smtp_password" value="{{cfg.get('smtp_password','')}}" required>
<label><input type="checkbox" name="smtp_enabled" value="1" {% if cfg.get('smtp_enabled')=='1' %}checked{% endif %}> Enable Automatic Email</label>
<br><br><button class="btn green">💾 Save Email Settings</button>
</form>
<div class="flash" style="margin-top:15px">For Gmail, use an App Password instead of your normal Gmail password.</div>
</div>
{% endblock %}
