<!doctype html><html><head><meta charset="utf-8"><title>{{title}}</title><style>body{font-family:Arial;margin:30px}h1{text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #222;padding:9px;text-align:left}th{background:#eee}@media print{button{display:none}body{margin:10px}}</style></head><body><button onclick="window.print()">🖨️ Print</button><h1>ATHARV EXAM MANAGEMENT SYSTEM</h1><h2 style="text-align:center">{{title}}</h2><table><tr><th>Sr. No.</th><th>Roll No.</th><th>Student Name</th><th>Class</th><th>Mobile</th></tr>{% for s in rows %}<tr><td>{{loop.index}}</td><td>{{s.roll_no}}</td><td>{{s.full_name}}</td><td>{{s.class_name}}</td><td>{{s.mobile}}</td></tr>{% endfor %}</table><p>Total Students: {{rows|length}}</p></body></html>
