{% extends "base.html" %}{% block content %}
<h1>👤 Create Institute Admin Login</h1>
<div class="box">
<h2>{{ lic.institute_name }}</h2>
<p>License Key: <code>{{ lic.license_key }}</code></p>
<p>Status: <b>{{ lic.status }}</b></p>
<form method="post">
<label>School / College / Institute</label>
<input value="{{ lic.institute_name }}" disabled>
<label>Username</label>
<input name="username" value="{{ existing.username if existing else '' }}" placeholder="Enter Username" required>
<label>Password</label>
<input type="text" name="password" value="{{ existing.password if existing else '' }}" placeholder="Enter Password" required>
<button class="btn green">{{ 'Update Login' if existing else 'Create Login' }}</button>
<a href="{{url_for('license_admin')}}" class="btn">Back</a>
</form>
<hr>
<p><b>Login Role:</b> Institute Admin</p>
<p>This user is linked to this School / College License.</p>
</div>
{% endblock %}
