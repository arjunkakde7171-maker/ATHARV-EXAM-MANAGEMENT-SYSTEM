{% extends "base.html" %}{% block content %}
<h1>👩‍🏫 Teacher & Staff User Management</h1>
<div class="box">
<h2>Create New User</h2>
<form method="post">
<input type="hidden" name="action" value="create">
<input name="username" placeholder="Teacher User ID" required>
<input name="password" placeholder="Password" required>
<select name="role"><option value="Teacher">Teacher</option><option value="Staff">Staff</option></select>
<button class="btn green">➕ Create User</button>
</form>
</div>
<div class="box">
<h2>Existing Users</h2>
<div class="table-wrap"><table>
<tr><th>User ID</th><th>Role</th><th>Password Reset</th><th>Delete</th></tr>
{% for u in users %}<tr>
<td><b>{{u.username}}</b></td><td>{{u.role}}</td>
<td><form method="post"><input type="hidden" name="action" value="reset"><input type="hidden" name="id" value="{{u.id}}"><input name="password" placeholder="New Password" required><button class="btn orange">Reset</button></form></td>
<td><form method="post" onsubmit="return confirm('Delete this user?')"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{u.id}}"><button class="btn red">Delete</button></form></td>
</tr>{% else %}<tr><td colspan="4">No teacher users created yet.</td></tr>{% endfor %}
</table></div>
</div>
{% endblock %}
