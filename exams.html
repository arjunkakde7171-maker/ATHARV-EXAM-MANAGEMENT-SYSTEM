{% extends "base.html" %}{% block content %}<h1>📝 Exam Management</h1><form method="post" class="form"><input name="title" placeholder="Exam Name" required><select name="class_id">{% for c in classes %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input type="number" name="total_marks" placeholder="Total Marks" required><input type="number" name="passing_marks" placeholder="Passing Marks" required><input type="number" name="duration" placeholder="Duration in Minutes" required><input type="date" name="exam_date"><button class="btn">Create Exam</button></form><table><tr><th>Exam</th><th>Class</th><th>Marks</th><th>Pass</th><th>Duration</th><th>Questions</th><th>Action</th></tr>{% for e in rows %}<tr><td>{{e.title}}</td><td>{{e.class_name}}</td><td>{{e.total_marks}}</td><td>{{e.passing_marks}}</td><td>{{e.duration}} min</td><td>{{e.qcount}}</td><td><a class="btn" href="/questions/{{e.id}}">Manage Questions</a></td></tr>{% endfor %}</table>{% endblock %}
